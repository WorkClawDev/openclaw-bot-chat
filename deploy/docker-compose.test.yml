services:
  postgres:
    image: ${TEST_POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:15-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DBNAME}
    ports:
      - "127.0.0.1:${TEST_DATABASE_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: ${TEST_REDIS_IMAGE:-mirror.gcr.io/library/redis:7-alpine}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  emqx:
    image: ${TEST_EMQX_IMAGE:-mirror.gcr.io/emqx/emqx:5.8.5}
    restart: unless-stopped
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_LOG__CONSOLE_HANDLER__LEVEL: warning
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        printf 'user_id,password,is_superuser\n%s,%s,false\n' "$$MQTT_USERNAME" "$$MQTT_PASSWORD" > /opt/emqx/etc/auth-built-in-db-bootstrap.csv
        exec /opt/emqx/bin/emqx foreground
    ports:
      - "127.0.0.1:${TEST_MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${TEST_MQTT_WS_PORT:-8083}:8083"
      - "127.0.0.1:${TEST_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - ./run/test-env/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./run/test-env/emqx-acl.conf:/opt/emqx/etc/test-acl.conf:ro
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD-SHELL", "/opt/emqx/bin/emqx ctl status | grep -q 'is started'"]
      interval: 5s
      timeout: 5s
      retries: 18

  storage:
    image: ${TEST_NODE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    restart: unless-stopped
    command:
      - /opt/seaweedfs/weed
      - -logtostderr=true
      - -v=0
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -s3.port=9000
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -admin.ui=false
      - -webdav=false
      - -s3.config=/run/storage-auth.json
      - -bucket=${STORAGE_S3_BUCKET}
      - -master.volumeSizeLimitMB=64
      - -volume.max=4
      - -master.telemetry.url=
    volumes:
      - ./run/test-env/seaweedfs:/opt/seaweedfs:ro
      - ./run/test-env/storage-auth.json:/run/storage-auth.json:ro
      - seaweed_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ${TEST_NODE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    restart: unless-stopped
    working_dir: /app/backend
    command:
      - /bin/sh
      - -c
      - |
        export NO_PROXY="$${NO_PROXY:+$$NO_PROXY,}localhost,127.0.0.1,postgres,redis,emqx,storage,backend,frontend,proxy"
        export no_proxy="$${no_proxy:+$$no_proxy,}localhost,127.0.0.1,postgres,redis,emqx,storage,backend,frontend,proxy"
        exec /app/bin/test-server
    env_file: [./.env.test]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_BROKER: tcp://emqx:1883
    ports:
      - "127.0.0.1:${TEST_API_PORT:-8080}:8080"
    volumes:
      - ./backend/bin:/app/bin:ro
      - ./backend/config.yaml:/app/backend/config.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      emqx: { condition: service_healthy }
      storage: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 18

  frontend:
    image: ${TEST_NODE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    user: "${TEST_FRONTEND_UID:-1000}:${TEST_FRONTEND_GID:-1000}"
    restart: unless-stopped
    working_dir: /app/frontend
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_EXTRA_CA_CERTS: /run/proxy-ca.pem
    volumes:
      - ./frontend:/app/frontend
      - ./run/test-env/proxy-ca.pem:/run/proxy-ca.pem:ro
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login',{signal:AbortSignal.timeout(15000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 20s
      start_period: 60s
      retries: 18

  proxy:
    image: ${TEST_NODE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    restart: unless-stopped
    working_dir: /app/scripts/test-environment
    command: ["node", "proxy.mjs"]
    env_file: [./.env.test]
    volumes:
      - ./scripts/test-environment:/app/scripts/test-environment:ro
    ports:
      - "127.0.0.1:${TEST_WEB_PORT:-3000}:3000"
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/_test/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  echo-bot:
    image: ${TEST_NODE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    profiles: [fixtures]
    restart: unless-stopped
    working_dir: /app/scripts/test-environment
    command: ["node", "echo-bot.mjs"]
    environment:
      TEST_STATE_DIR: /state
    volumes:
      - ./scripts/test-environment:/app/scripts/test-environment:ro
      - ./run/test-env:/state
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "if(!require('fs').existsSync('/state/echo.ready'))process.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  emqx_data:
  emqx_log:
  seaweed_data:
