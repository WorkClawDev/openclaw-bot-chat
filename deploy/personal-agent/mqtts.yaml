server:
  bind_address: "0.0.0.0"
  port: 1883
  thread_count: 2
  max_connections: 1000
mqtt:
  allow_mqtt3x: true
  max_packet_size: 1048576
memory:
  client_max_size: 4194304
monitoring:
  enabled: false
log:
  level: warn
auth:
  enabled: true
  allow_anonymous: false
  cache_enabled: false
  providers:
    - type: http
      settings:
        authentication_url: http://backend:8080/internal/broker/authentication
        authorization_url: http://backend:8080/internal/broker/authorization
        token_file: /run/secrets/broker-token
        timeout_ms: 500
        http_workers: 4
        http_queue_capacity: 64
        http_queue_bytes: 16777216
        failure_cooldown_ms: 1000
        cache_ttl_ms: 10000
        cache_max_age_ms: 300000
        cache_max_entries: 16384
        cache_version_url: http://backend:8080/internal/broker/cache-version
        cache_version_interval_ms: 250
        # Identity and unknown fields remain bound to the authorization decision.
        publish_cache_ignored_fields: '["id","timestamp","content"]'
        # Opaque payload forwarding; only the backend interprets chat fields.
        publish_payload: base64
        max_payload_bytes: 1048576
