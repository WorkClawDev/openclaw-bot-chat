name: Personal agent
on:
  push:
    paths: ['test/openclaw-bot-chat/**', 'scripts/test-agent*', '.github/workflows/personal-agent.yml']
  pull_request:
    paths: ['test/openclaw-bot-chat/**', 'scripts/test-agent*', '.github/workflows/personal-agent.yml']
jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/openclaw-bot-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/openclaw-bot-chat/package-lock.json
      - run: npm ci
      - run: npm run ci
