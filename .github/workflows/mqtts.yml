name: Broker contract integration
on:
  workflow_dispatch:
    inputs:
      mqtts_image:
        description: 'Prebuilt broker image to test (tag or registry digest); empty uses pinned CI artifact'
        required: false
        type: string
  push:
    paths: ['docker-compose.yml', 'deploy/**', 'scripts/test-environment/check-broker-deployment.py', 'backend/**', 'broker/mqtts/**', 'scripts/test-environment/mqtts-permissions.mjs', '.github/workflows/mqtts.yml']
  pull_request:
    paths: ['docker-compose.yml', 'deploy/**', 'scripts/test-environment/check-broker-deployment.py', 'backend/**', 'broker/mqtts/**', 'scripts/test-environment/mqtts-permissions.mjs', '.github/workflows/mqtts.yml']
permissions:
  contents: read
  actions: read
jobs:
  permissions:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: mqtts_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval=5s --health-retries=15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval=5s --health-retries=15
    env:
      REQUESTED_MQTTS_IMAGE: ${{ inputs.mqtts_image || vars.MQTTS_TEST_IMAGE }}
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_USER: postgres
      DATABASE_PASSWORD: isolated-ci-password
      DATABASE_DBNAME: mqtts_acceptance
      DATABASE_SSLMODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      APP_HOST: 127.0.0.1
      APP_PORT: '18081'
      APP_MODE: test
      AUTH_PHONE_ENABLED: 'false'
      LOG_LEVEL: warn
      MQTT_BROKER: tcp://127.0.0.1:1886
      MQTT_TCP_PUBLIC_URL: mqtt://127.0.0.1:1886
      MQTT_WS_PUBLIC_URL: ws://127.0.0.1:1886/mqtt
      MQTT_CLIENT_ID: acceptance-backend
      MQTT_USERNAME: acceptance-backend
      BROKER_SECURITY_REQUIRE_MESSAGE_IDENTITY: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate independent deployment configurations
        run: python3 scripts/test-environment/check-broker-deployment.py
      - name: Read pinned broker artifact
        id: broker
        if: env.REQUESTED_MQTTS_IMAGE == ''
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          lock = json.loads(pathlib.Path('broker/mqtts/compatibility.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ['repository', 'workflow_run_id', 'artifact_name']:
                  output.write(key + '=' + str(lock[key]) + '\n')
          PYTHON
      - uses: actions/download-artifact@v4
        if: env.REQUESTED_MQTTS_IMAGE == ''
        with:
          repository: ${{ steps.broker.outputs.repository }}
          run-id: ${{ steps.broker.outputs.workflow_run_id }}
          name: ${{ steps.broker.outputs.artifact_name }}
          github-token: ${{ github.token }}
          path: run/broker-runtime
      - name: Verify and load independently built image
        if: env.REQUESTED_MQTTS_IMAGE == ''
        run: |
          (cd run/broker-runtime && sha256sum -c SHA256SUMS)
          python3 - <<'PYTHON'
          import json, os, pathlib
          lock = json.loads(pathlib.Path('broker/mqtts/compatibility.json').read_text())
          metadata = json.loads(pathlib.Path('run/broker-runtime/metadata.json').read_text())
          assert metadata['schema_version'] == 1 and metadata['http_auth_contract'] == 1
          assert metadata['source_revision'] == lock['source_revision']
          assert metadata['platform'] == 'linux/amd64'
          assert metadata['image'] == 'mqtts:sha-' + lock['source_revision']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('MQTTS_TEST_IMAGE=' + metadata['image'] + '\n')
          PYTHON
          docker load --input run/broker-runtime/mqtts-image.tar.gz
      - name: Pull explicitly selected broker version
        if: env.REQUESTED_MQTTS_IMAGE != ''
        run: |
          docker pull "$REQUESTED_MQTTS_IMAGE"
          echo "MQTTS_TEST_IMAGE=$REQUESTED_MQTTS_IMAGE" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable secrets and database prerequisites
        run: |
          python3 - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name in ['JWT_SECRET', 'MQTT_PASSWORD', 'BROKER_SECURITY_CALLBACK_TOKEN']:
                  value = secrets.token_hex(32)
                  print('::add-mask::' + value)
                  output.write(name + '=' + value + '\n')
          PY
          PGPASSWORD="$DATABASE_PASSWORD" psql -h 127.0.0.1 -U postgres -d mqtts_acceptance -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"'
      - run: go -C backend build -o ../run/backend ./cmd/server && go -C backend build -o ../run/admin-user ./cmd/admin-user
      - run: npm --prefix scripts/test-environment ci
      - name: Run real PostgreSQL, Redis, MQTT and permission acceptance
        run: |
          python3 - <<'PY'
          import pathlib
          source = pathlib.Path('broker/mqtts/mqtts.yaml').read_text()
          source = source.replace('port: 1883', 'port: 1886').replace('http://backend:8080', 'http://127.0.0.1:18081')
          pathlib.Path('run/mqtts-ci.yaml').write_text(source)
          PY
          docker run -d --name mqtts-access --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            -e BROKER_SECURITY_CALLBACK_TOKEN -e NO_PROXY=localhost,127.0.0.1 \
            -v "$PWD/run/mqtts-ci.yaml:/app/config/mqtts.yaml:ro" "$MQTTS_TEST_IMAGE"
          (cd backend && exec ../run/backend) > run/backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; docker logs mqtts-access; docker rm -f mqtts-access' EXIT
          MQTTS_TEST_ADMIN_CLI="$PWD/run/admin-user" node scripts/test-environment/mqtts-permissions.mjs
