# OpenClaw Bot Chat Backend Configuration

app:
  host: "0.0.0.0"
  port: 8080
  mode: debug  # debug, release, test

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "openclaw_bot_chat"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300  # seconds

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10

mqtt:
  broker: "tcp://127.0.0.1:1883"
  client_id: "openclaw-backend"
  username: "openclaw_backend"
  password: "change-me-in-production"  # replace outside local/dev
  topic_prefix: "chat"
  qos: 1
  auto_reconnect: true
  reconnect_delay: 5  # seconds
  tcp_public_url: "mqtt://127.0.0.1:1883"
  ws_public_url: "ws://127.0.0.1:8083/mqtt"

jwt:
  secret: "your-super-secret-jwt-key-change-in-production"
  access_token_ttl: 7200     # 2 hours in seconds
  refresh_token_ttl: 604800  # 7 days in seconds
  issuer: "openclaw-bot-chat"

auth:
  phone:
    enabled: true
    allowed_country_codes: ["86"]
    code_ttl_seconds: 300
    send_cooldown_seconds: 60
    phone_hourly_limit: 5
    phone_daily_limit: 10
    ip_hourly_limit: 30
    max_verify_attempts: 5
    code_pepper: "" # defaults to jwt.secret; set independently in production
    mock_code: ""   # optional fixed code for local/test only

sms:
  provider: mock # mock, aliyun
  aliyun:
    access_key_id: ""
    access_key_secret: ""
    sign_name: ""
    template_code: ""
    endpoint: "https://dysmsapi.aliyuncs.com/"

captcha:
  provider: mock # mock, turnstile; production must use a real provider
  turnstile:
    secret_key: ""
    endpoint: "https://challenges.cloudflare.com/turnstile/v0/siteverify"

storage:
  provider: "" # empty disables object storage; supported providers: cos, oss, s3
  bucket: ""
  region: ""
  endpoint: ""
  public_base_url: ""
  private_read: true
  upload_url_ttl: 900
  download_url_ttl: 900
  key_prefix: "chat-assets"
  cos:
    secret_id: ""
    secret_key: ""
    session_token: ""
  oss:
    access_key_id: ""
    access_key_secret: ""
    security_token: ""
  s3:
    endpoint: ""         # backend/internal endpoint, e.g. minio:9000
    public_endpoint: ""  # optional browser/client endpoint for presigned URLs, e.g. 127.0.0.1:9000
    region: ""
    bucket: ""
    access_key: ""
    secret_key: ""
    ssl: false

asset:
  max_image_size_mb: 10
  max_audio_size_mb: 20

log:
  level: debug  # debug, info, warn, error
  format: json  # json, console
